{% extends "base_admin.html" %}

{% block content %}

<form method="POST">

<div class="card shadow border-0">

<div class="card-header bg-success text-white">
    <h3 class="mb-0">
        Add New Staff
    </h3>
</div>

<div class="card-body">

    <h5 class="mb-3 text-success">
        Login Credentials
    </h5>

    <div class="row">

        <div class="col-md-4 mb-3">
            <label class="form-label">
                Username
            </label>

            <input type="text"
                   name="username"
                   class="form-control"
                   required>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">
                Email
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   required>
        </div>

        <div class="col-md-4 mb-3">
            <label class="form-label">
                Password
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>
        </div>

    </div>

    <hr>

    <h5 class="mb-3 text-success">
        Staff Information
    </h5>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Staff Name</label>

            <input type="text"
                   name="name"
                   class="form-control"
                   required>
        </div>

        <div class="col-md-6 mb-3">
            <label>Role</label>

              <select name="role"
                     class="form-select"
                     required>

              <option value="">
                     Select Role
              </option>

              <option value="Teaching">
                     Teaching
              </option>

              <option value="Mobilizer">
                     Mobilizer
              </option>

              <option value="Marketing & Sales">
                     Marketing & Sales
              </option>

              <option value="Housekeeping">
                     Housekeeping
              </option>

              <option value="Security Guard">
                     Security Guard
              </option>

              <option value="Data Entry">
                     Data Entry
              </option>

              <option value="Surveyer">
                     Surveyer
              </option>

              <option value="Accountant">
                     Accountant
              </option>

              <option value="Coordinator">
                     Coordinator
              </option>

              <option value="Volunteer">
                     Volunteer
              </option>

              <option value="Others">
                     Others
              </option>

              </select>


        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Department</label>

            <input type="text"
                   name="department"
                   class="form-control">
        </div>

        <div class="col-md-6 mb-3">
            <label>Phone</label>

            <input type="text"
                   name="phone"
                   class="form-control">
        </div>

    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Gender</label>

            <select name="gender"
                    class="form-select"
                    required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label>Proof Type</label>

            <select name="proof_id"
                    class="form-select">

                <option value="Aadhaar">
                    Aadhaar
                </option>

                <option value="PAN">
                    PAN
                </option>

                <option value="Voter ID">
                    Voter ID
                </option>

            </select>

        </div>

        <div class="col-md-6 mb-3">
            <label>ID Number</label>

            <input type="text"
                   name="id_num"
                   class="form-control">
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Salary</label>

            <input type="number"
                   name="salary"
                   class="form-control">
        </div>

        <div class="col-md-6 mb-3">
            <label>Joining Date</label>

            <input type="date"
                   name="joining_date"
                   class="form-control">
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Date of Birth</label>

            <input type="date"
                   name="dob"
                   class="form-control">
        </div>

        <div class="col-md-6 mb-3">
            <label>Nationality</label>

            <input type="text"
                   name="nationality"
                   class="form-control"
                   placeholder="Indian">
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>State</label>

            <input type="text"
                   name="state"
                   class="form-control"
                   placeholder="Bihar">
        </div>

        <div class="col-md-6 mb-3">
            <label>Address</label>

            <textarea name="address"
                      class="form-control"
                      rows="3"
                      placeholder="Enter Full Address"></textarea>
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Pincode</label>

            <input type="text"
                   name="pincode"
                   class="form-control"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   placeholder="800001">
        </div>

        <div class="col-md-6 mb-3">
            <label>Blood Group</label>

            <select name="blood_group"
                    class="form-select">

                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>
        </div>

    </div>

    <hr>

    <button type="submit"
            class="btn btn-success">

        Save Staff

    </button>

    <a href="{{ url_for('staff_list') }}"
       class="btn btn-secondary">

        Cancel

    </a>

</div>


</div>

</form>

{% endblock %}
