{% extends "base_admin.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-success text-white">
    <h3 class="mb-0">
        Add New Staff
    </h3>
</div>

<div class="card-body">

<form method="POST">

<div class="row">

    <div class="col-md-4 mb-3">
        <label>Username</label>
        <input type="text"
               name="username"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Email</label>
        <input type="email"
               name="email"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Password</label>
        <input type="password"
               name="password"
               class="form-control"
               required>
    </div>

</div>

<hr>

<h5 class="text-success mb-3">
    Personal Information
</h5>

<div class="row">

    <div class="col-md-4 mb-3">
        <label>Full Name</label>
        <input type="text"
               name="name"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Role</label>
        <input type="text"
               name="role"
               class="form-control"
               placeholder="Mobilizer"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Department</label>
        <input type="text"
               name="department"
               class="form-control">
    </div>

</div>

<div class="row">

    <div class="col-md-4 mb-3">
        <label>Gender</label>

        <select name="gender"
                class="form-select"
                required>

            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>

        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Date of Birth</label>
        <input type="date"
               name="dob"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Blood Group</label>

        <select name="blood_group"
                class="form-select"
                required>

            <option value="">Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>
    </div>

</div>

<hr>

<h5 class="text-success mb-3">
    Contact Information
</h5>

<div class="row">

    <div class="col-md-4 mb-3">
        <label>Phone Number</label>
        <input type="text"
               name="phone"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Proof ID</label>

        <select name="proof_id"
                class="form-select"
                required>

            <option value="">Select</option>
            <option>Aadhaar</option>
            <option>PAN</option>
            <option>Voter ID</option>
            <option>Driving Licence</option>

        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>ID Number</label>
        <input type="text"
               name="id_num"
               class="form-control"
               required>
    </div>

</div>

<div class="mb-3">

    <label>Address</label>

    <textarea name="address"
              class="form-control"
              rows="3"
              required></textarea>

</div>

<div class="row">

    <div class="col-md-4 mb-3">
        <label>State</label>
        <input type="text"
               name="state"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Nationality</label>
        <input type="text"
               name="nationality"
               class="form-control"
               value="India"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Pincode</label>
        <input type="text"
               name="pincode"
               class="form-control"
               required>
    </div>

</div>

<hr>

<h5 class="text-success mb-3">
    Employment Details
</h5>

<div class="row">

    <div class="col-md-4 mb-3">
        <label>Salary</label>
        <input type="number"
               step="0.01"
               name="salary"
               class="form-control">
    </div>

    <div class="col-md-4 mb-3">
        <label>Joining Date</label>
        <input type="date"
               name="joining_date"
               class="form-control"
               required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Completion Date</label>
        <input type="date"
               name="completion_date"
               class="form-control">
    </div>

</div>

<div class="row">

    <div class="col-md-4 mb-3">

        <label>Status</label>

        <select name="status"
                class="form-select">

            <option value="Active" selected>
                Active
            </option>

            <option value="Inactive">
                Inactive
            </option>

        </select>

    </div>

</div>

<hr>

<button type="submit"
        class="btn btn-success">

    Save Staff

</button>

<a href="{{ url_for('staff_list') }}"
   class="btn btn-secondary">

    Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
