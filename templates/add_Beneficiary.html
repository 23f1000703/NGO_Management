{% extends "base_staff.html" %}

{% block content %}

<div class="container-fluid">

<div class="card shadow border-0">

    <div class="card-header bg-success text-white">
        <h3 class="mb-0">
            New Beneficiary Admission
        </h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="row">


                <div class="col-md-4 mb-3">
                    <label>Full Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Date of Birth</label>
                    <input type="date"
                           name="dob"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Beneficiary Category</label>

                    <select name="beneficiary_category"
                            class="form-select"
                            required>

                        <option value="">Select Category</option>

                        <option value="Student">Student</option>
                        <option value="Children">Children</option>
                        <option value="Farmer">Farmer</option>
                        <option value="Livelihood & Skill Development">
                            Livelihood & Skill Development
                        </option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Person with Disability">
                            Person with Disability
                        </option>
                        <option value="Women">Women</option>
                        <option value="Youth">Youth</option>
                        <option value="Vulnerable Community">
                            Vulnerable Community
                        </option>

                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Gender</label>

                    <select name="gender"
                            class="form-select"
                            required>

                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>

                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Social Category</label>

                    <select name="category"
                            class="form-select"
                            required>

                        <option value="">Select Category</option>

                        <option value="General">General</option>
                        <option value="OBC">OBC</option>
                        <option value="SC">SC</option>
                        <option value="ST">ST</option>

                    </select>
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Caste</label>
                    <input type="text"
                           name="caste"
                           class="form-control">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Blood Group</label>

                    <select name="blood_group"
                            class="form-select">

                        <option value="">Select</option>

                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>

                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           class="form-control">
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Phone</label>
                    <input type="text"
                           name="phone"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Proof Type</label>

                    <select name="proof_id"
                            class="form-select"
                            required>

                        <option value="">Select</option>

                        <option>Aadhaar</option>
                        <option>PAN</option>
                        <option>Voter ID</option>
                        <option>Driving Licence</option>

                    </select>
                </div>

                <div class="col-md-4 mb-3">
                    <label>ID Number</label>
                    <input type="text"
                           name="id_no"
                           class="form-control"
                           required>
                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Pincode</label>
                    <input type="text"
                           name="pincode"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Village</label>
                    <input type="text"
                           name="village"
                           class="form-control"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Monthly Fee</label>
                    <input type="number"
                           name="monthly_fee"
                           class="form-control">
                </div>

            </div>

            <div class="mb-3">
                <label>Address</label>

                <textarea name="address"
                          class="form-control"
                          rows="3"
                          required></textarea>
            </div>

            <hr>

            <h5>Guardian Information</h5>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label>Guardian Name</label>
                    <input type="text"
                           name="guardian_name"
                           class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Relation</label>
                    <input type="text"
                           name="guardian_relation"
                           class="form-control">
                </div>

            </div>

            <div class="mb-3">
                <label>Remarks</label>

                <textarea name="remarks"
                          class="form-control"
                          rows="3"></textarea>
            </div>

            <hr>

            <button type="submit"
                    class="btn btn-success">
                Save Beneficiary
            </button>

            <a href="#"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

</div>

{% endblock %}
