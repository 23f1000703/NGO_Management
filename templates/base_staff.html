<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Panel</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    body{
        background:#f4f6f9;
        margin:0;
    }

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        width:250px;
        height:100vh;
        background:#198754;
        color:white;
    }

    .sidebar h4{
        padding:20px;
        text-align:center;
        border-bottom:1px solid rgba(255,255,255,.2);
    }

    .sidebar a{
        display:block;
        color:white;
        text-decoration:none;
        padding:12px 20px;
    }

    .sidebar a:hover{
        background:rgba(255,255,255,.15);
    }

    .main{
        margin-left:250px;
    }

    .topbar{
        height:70px;
        background:white;
        box-shadow:0 2px 5px rgba(0,0,0,.1);
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:0 25px;
    }

    .content{
        padding:25px;
    }
    .sidebar-logo{
        width:90px;
        height:90px;
        object-fit:cover;
        border-radius:50%;
        border:3px solid white;
        margin-bottom:0px;
    }

</style>

</head>

<body>

<div class="sidebar">
    <div class="text-center py-3">
        <img src="{{ url_for('static', filename='logo.jpeg') }}"
             class="sidebar-logo"
             alt="Logo">
    </div>

    <hr class="text-white">

    <a href="{{ url_for('staff_dashboard',staff_id=current_user.staff.id) }}">
        Dashboard
    </a>

    <a href="{{ url_for('staff_beneficiary')}}">
        Beneficiaries
    </a>

    <a href="{{ url_for('student_list') }}">
        Student
    </a>

    <a href="{{ url_for('add_beneficiary') }}">
    Add Admission
    </a>

    <a href="{{ url_for('staff_attendance') }}">
        My Attendance
    </a>

    <a href="{{ url_for('my_profile') }}">
        My Profile
    </a>

    <a href="{{ url_for('logout') }}">
        Logout
    </a>

</div>

<div class="main">

    <div class="topbar">

        <h5 class="mb-0">
            Ngo Management
        </h5>

        <span>
            Staff Dashboard
        </span>

    </div>

    <div class="content">

        {% block content %}
        {% endblock %}

    </div>

</div>

</body>

</html>
