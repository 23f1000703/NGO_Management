<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ngo Management | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:linear-gradient(135deg,#e8f5e9,#d7f2df,#f5fff7);

    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

}

/* Navbar */

.navbar{

    background:white;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.navbar-brand{

    font-weight:bold;

    color:#198754 !important;

}

.logo{

    width:50px;

    height:50px;

    object-fit:contain;

}

/* Login Card */

.login-section{

    min-height:85vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.login-card{

    width:430px;

    border:none;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.card-header{

    background:#198754;

    color:white;

    text-align:center;

    padding:30px;

}

.card-header img{

    width:90px;

    height:90px;

    object-fit:contain;

    background:white;

    border-radius:50%;

    padding:8px;

    margin-bottom:15px;

}

.form-control{

    border-radius:10px;

    padding:10px;

}

.btn-login{

    background:#198754;

    color:white;

    font-weight:bold;

    border-radius:10px;

    padding:10px;

}

.btn-login:hover{

    background:#146c43;

}

.footer{

    text-align:center;

    padding:15px;

    color:#777;

}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand d-flex align-items-center" href="#">

<img src="{{ url_for('static',filename='logo.jpeg') }}"
class="logo me-2">

<div>

<div>Ngo Management</div>


</div>

</a>

<a href="{{ url_for('home') }}"
   class="btn btn-outline-success">

← Back

</a>

</div>

</nav>

<!-- Login -->

<div class="container login-section">

<div class="card login-card">

<div class="card-header">

<img src="{{ url_for('static',filename='logo.jpeg') }}">

<h3>Ngo Management</h3>

<p class="mb-0">
Welcome
</p>

</div>

<div class="card-body p-4">

<form method="POST">

<div class="mb-3">

<label class="form-label">

Your Username

</label>

<input
type="username"
name="username"
class="form-control"
placeholder="Enter username"
required>

</div>

<div class="mb-4">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<button
type="submit"
class="btn btn-login w-100">

Login

</button>

</form>

<hr>

<div class="text-center">

<small class="text-muted">

Only Authorized Staff & Admin Can Login

</small>

</div>

</div>

</div>

</div>

<div class="footer">

© 2026 Ngo Management | All Rights Reserved

</div>

</body>

</html>
